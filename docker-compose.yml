services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_parking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_parking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swayam12
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_parking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_parking_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/smart_parking_db
      DB_USERNAME: postgres
      DB_PASSWORD: swayam12
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: smart_parking_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      CI: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      PORT: "8081"

volumes:
  postgres_data:
